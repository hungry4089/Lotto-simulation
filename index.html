<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>행복한 로또 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>😊 행복한 로또 시뮬레이션</h1>
        </header>

        <main class="dashboard">
            <!-- 좌측: 내 번호 설정 -->
            <section class="panel my-numbers-panel">
                <div class="panel-header">
                    <div class="title-group">
                        <h3>내 번호 목록</h3>
                    </div>
                    <div class="header-actions">
                        <button id="fill-random-btn" class="secondary-btn-small">현재 목록 무작위 채우기</button>
                        <label class="checkbox-label-inline">
                            <input type="checkbox" id="random-each-draw-toggle"> 매회 무작위
                        </label>
                    </div>
                </div>
                <div class="batch-control-row">
                    <div class="batch-group">
                        <input type="number" id="batch-count" value="5" min="1" max="100">
                        <button id="batch-add-btn">개 추가</button>
                    </div>
                    <button id="add-row-btn" title="줄 추가">+</button>
                    <span id="weekly-cost" class="cost-badge">1,000원/주 (1개)</span>
                </div>
                <div id="my-numbers-list" class="my-numbers-list">
                    <!-- 번호 입력 줄이 여기에 추가됨 -->
                </div>
            </section>

            <!-- 중앙: 메인 시뮬레이터 -->
            <section class="panel main-sim-panel">
                <div class="sim-controls">
                    <div class="speed-control">
                        <label>속도:</label>
                        <input type="range" id="speed-slider" min="1" max="100" value="1">
                    </div>
                    <div class="target-select">
                        <label>목표:</label>
                        <select id="target-rank">
                            <option value="1">1등 당첨될 때까지</option>
                            <option value="2">2등 이상 당첨될 때까지</option>
                            <option value="3">3등 이상 당첨될 때까지</option>
                            <option value="4">4등 이상 당첨될 때까지</option>
                            <option value="5">5등 이상 당첨될 때까지</option>
                        </select>
                    </div>
                    <div class="btn-group">
                        <button id="start-btn" class="primary-btn">시작</button>
                        <button id="stop-btn" class="danger-btn" style="display:none;">중단</button>
                        <button id="reset-btn" class="reset-btn">초기화</button>
                    </div>
                </div>

                <div class="current-draw">
                    <div id="current-balls" class="balls-container">
                        <!-- 현재 추첨 중인 공들 -->
                    </div>
                </div>

                <div class="history-container">
                    <div class="history-box">
                        <div class="history-header">
                            <span>실시간 추첨 내역</span>
                            <span id="draw-count">0회 시도</span>
                        </div>
                        <div id="history-wheel" class="history-wheel"></div>
                    </div>
                    <div class="history-box">
                        <div class="history-header">
                            <span>당첨 내역</span>
                        </div>
                        <div id="win-history-wheel" class="history-wheel"></div>
                    </div>
                </div>
            </section>

            <!-- 우측: 정보 및 통계 -->
            <section class="panel info-panel">
                <div class="stats-card">
                    <h4>번호별 출현 빈도</h4>
                    <div class="mini-chart-container">
                        <canvas id="mini-freq-chart"></canvas>
                    </div>
                    <div class="chart-label-groups">
                        <div class="label-group g-yellow"><span>1</span><span>10</span></div>
                        <div class="label-group g-blue"><span>20</span></div>
                        <div class="label-group g-red"><span>30</span></div>
                        <div class="label-group g-gray"><span>40</span></div>
                        <div class="label-group g-green"><span>45</span></div>
                    </div>
                </div>

                <div class="summary-card">
                    <div class="summary-item">
                        <span class="label">총 지출</span>
                        <span id="total-cost" class="value">0원</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">총 대조 번호 수</span>
                        <span id="total-count-summary" class="value">0개</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">소요 시간</span>
                        <span id="total-time" class="value">0주</span>
                    </div>
                </div>

                <div class="win-count-card">
                    <h4>내 당첨 통계 (당첨 확률)</h4>
                    <div class="win-stat-item">
                        <span>1등</span>
                        <div class="stat-values">
                            <strong id="stat-win-1">0회</strong>
                            <span class="odds-info">(1/8,145,060)</span>
                        </div>
                    </div>
                    <div class="win-stat-item">
                        <span>2등</span>
                        <div class="stat-values">
                            <strong id="stat-win-2">0회</strong>
                            <span class="odds-info">(1/1,357,510)</span>
                        </div>
                    </div>
                    <div class="win-stat-item">
                        <span>3등</span>
                        <div class="stat-values">
                            <strong id="stat-win-3">0회</strong>
                            <span class="odds-info">(1/35,724)</span>
                        </div>
                    </div>
                    <div class="win-stat-item">
                        <span>4등</span>
                        <div class="stat-values">
                            <strong id="stat-win-4">0회</strong>
                            <span class="odds-info">(1/733)</span>
                        </div>
                    </div>
                    <div class="win-stat-item">
                        <span>5등</span>
                        <div class="stat-values">
                            <strong id="stat-win-5">0회</strong>
                            <span class="odds-info">(1/45)</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
